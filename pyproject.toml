[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunshine_dashboard"
version = "0.1.0"
description = "Visual dashboard for GitHub issue reports."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    # The "standard" extra includes jinja2 and uvicorn[standard], which the app uses.
    "fastapi[standard]>=0.116.0",
]

[project.scripts]
sunshine-dashboard = "sunshine_dashboard.app:main"

[tool.setuptools.package-data]
sunshine_dashboard = ["templates/*.html", "static/*.css"]

[tool.fastapi]
entrypoint = "sunshine_dashboard.app:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
