version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ up to date,
  # updating both the SHA and its "# vX.Y.Z" comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]  # one PR for all action updates
    commit-message:
      prefix: ci
